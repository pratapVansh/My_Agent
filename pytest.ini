[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
markers =
    postgres: needs a real PostgreSQL server. Opt-in, and destructive against
        its dedicated test database — set POSTGRES_INTEGRATION_TESTS=1 to run.
        Skipped by default so the normal suite stays offline and fast.
filterwarnings =
    ignore::DeprecationWarning
