services:
  - type: web
    name: my-agent-backend
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: ENVIRONMENT
        value: production
      # Comma-separated list of origins allowed to call this API from a browser.
      # Must be set to the deployed frontend URL — otherwise CORS falls back to
      # the localhost defaults and blocks the real frontend.
      - key: ALLOWED_ORIGINS
        sync: false
      # ── Authentication (all required) ──────────────────────────────────
      # Generate with: python scripts/create_owner_password.py
      # JWT secrets must be different from each other and 32+ chars.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OWNER_USERNAME
        sync: false
      - key: OWNER_PASSWORD_HASH
        sync: false
      - key: OWNER_USER_ID
        value: vansh
      # Frontend is served from a different host, so cookies must be
      # SameSite=None, which browsers only accept alongside Secure.
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: none
      - key: POSTGRES_HOST
        fromDatabase:
          name: my-agent-postgres
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: my-agent-postgres
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: my-agent-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: my-agent-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: my-agent-postgres
          property: password
      - key: GROQ_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_TRACING_ENABLED
        value: "true"
      - key: LANGSMITH_PROJECT
        value: my-agent

  - type: web
    name: my-agent-frontend
    env: node
    plan: starter
    rootDir: frontend
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        sync: false

databases:
  - name: my-agent-postgres
    plan: starter
